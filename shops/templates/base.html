<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ brand }}{% endblock %} · {{ brand }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="wrap">
      <a class="logo" href="{{ url_for('home') }}"><span class="logo-mark">402</span>{{ brand }}</a>
      {% if mock_mode %}<a class="badge-mock" href="{{ url_for('docs') }}#mock" title="Payments are simulated until our local blockchain is connected. Click to learn more.">Mock mode</a>{% endif %}
      <div class="nav-links">
        {% set p = request.path %}
        <a href="{{ url_for('home') }}" class="{{ 'active' if p == '/' }}">Home</a>
        <a href="{{ url_for('docs') }}" class="{{ 'active' if p == '/docs' }}">How it works</a>
        <a href="{{ url_for('live') }}" class="{{ 'active' if p == '/live' }}">Live payments</a>
        <a href="http://localhost:8000" target="_blank" rel="noopener">Security demo &#8599;</a>
      </div>
    </div>
  </nav>

  <main>
    <div class="wrap">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer>
    <div class="wrap">{{ brand }} · a data shop for AI agents · demo with sample data, not financial advice</div>
  </footer>
  <script>window.SITE = {{ site_info | tojson }};</script>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
